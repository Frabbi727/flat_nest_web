<style>
  html, body { margin: 0; padding: 0; background: #0E1113; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  /* Tame default focus rings for buttons inside the admin */
  button:focus-visible {
    outline: 2px solid rgba(70,167,174,0.4);
    outline-offset: 1px;
  }
  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.10); }
</style>
