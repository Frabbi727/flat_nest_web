<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flatnest — Logo Exploration</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root{
    --ink:#161413;
    --paper:#f6f3ee;
    --paper-2:#efeae1;
    --rule:#1614131a;
    --accent:#d96a3a;     /* warm terracotta */
    --accent-2:#2b6a52;   /* mossy green */
    --accent-3:#3a4ca8;   /* indigo */
    --sand:#e8dfcf;
    --cream:#fbf8f1;
  }
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;}
  *{box-sizing:border-box;}

  /* Shared logo card chrome */
  .logo-card{
    width:100%; height:100%;
    display:grid; grid-template-rows: 1fr auto;
    background:var(--cream);
    position:relative;
    overflow:hidden;
  }
  .logo-card.dark{ background:var(--ink); color:var(--cream); }
  .logo-stage{
    display:flex; align-items:center; justify-content:center;
    padding:48px;
    position:relative;
  }
  .logo-meta{
    border-top:1px solid var(--rule);
    padding:16px 22px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:11px; letter-spacing:.04em;
    color:#161413aa;
    text-transform:uppercase;
  }
  .dark .logo-meta{ border-top-color:#fbf8f120; color:#fbf8f199; }
  .logo-meta b{ color:var(--ink); font-weight:600; }
  .dark .logo-meta b{ color:var(--cream); }

  /* Wordmark base */
  .wm{ display:inline-flex; align-items:center; gap:14px; }
  .wm-text{
    font-family:"Plus Jakarta Sans", sans-serif;
    font-weight:700;
    letter-spacing:-0.025em;
    font-size:62px;
    line-height:.95;
  }
  .wm-text .nest{ font-weight:500; color:#1614138c; }
  .dark .wm-text .nest{ color:#fbf8f199; }

  /* small caption row under big lockups */
  .tag{
    margin-top:14px;
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:#16141399;
  }
  .dark .tag{ color:#fbf8f1aa; }

  /* App icon tile */
  .tile{
    width:160px; height:160px;
    border-radius:36px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 1px 0 #ffffffb0 inset,
      0 -1px 0 #00000010 inset,
      0 18px 40px -20px #00000033;
    position:relative;
    overflow:hidden;
  }
  .tile.lg{ width:220px; height:220px; border-radius:50px;}
  .tile.sm{ width:84px; height:84px; border-radius:20px;}

  /* page chrome */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(to bottom, var(--paper) 70%, transparent);
    pointer-events:none;
  }
  .topbar .pill{
    pointer-events:auto;
    display:inline-flex; gap:10px; align-items:center;
    background:#ffffff; border:1px solid var(--rule);
    border-radius:999px; padding:8px 14px;
    font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <div class="pill"><span class="dot"></span> Flatnest · logo exploration · v1</div>
  <div class="pill" style="text-transform:none;letter-spacing:.02em;">drag to pan · scroll to zoom · click any board to focus</div>
</div>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logos.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
